name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: Require configured Windows and macOS signing credentials
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RIVET_REQUIRE_SIGNING: ${{ inputs.require_signing && matrix.os != 'ubuntu-latest' && '1' || '0' }}
      CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CSC_LINK || secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm run desktop:package
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rivet-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/*.yml
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

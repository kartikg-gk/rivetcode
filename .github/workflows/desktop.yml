name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      require_signing:
        description: Require configured Windows and macOS signing credentials
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RIVET_REQUIRE_SIGNING: ${{ inputs.require_signing && matrix.os != 'ubuntu-latest' && '1' || '0' }}
      CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CSC_LINK || secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm --prefix desktop ci
      # Without a certificate the signing settings arrive empty, and an empty CSC_LINK is read
      # as a file path; unset, the build skips signing (unless signing is required).
      - name: Package
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npm run desktop:package
      # The installed app, not the build folder: install, launch, daemon ready, uninstall.
      - if: matrix.os == 'windows-latest'
        run: npm run smoke:desktop-install
      # The packaged app on Mac and Linux: start it, daemon up, app page loaded.
      - if: matrix.os == 'ubuntu-latest'
        shell: bash
        env: { RIVET_DESKTOP_SMOKE: '1', RIVET_DATA_DIR: '${{ runner.temp }}/rivet data', RIVET_PORT: '0' }
        run: |
          export RIVET_RUN_FILE="$RIVET_DATA_DIR/running.json"
          sudo apt-get install -y xvfb >/dev/null
          out=$(timeout 120 xvfb-run -a desktop/release/linux-unpacked/rivet --no-sandbox 2>&1 || true)
          echo "$out" | tail -5
          echo "$out" | grep -q "Rivet desktop app loaded from the local daemon"
          kill "$(node -p "require(process.env.RIVET_RUN_FILE).pid")" || true
      - if: matrix.os == 'macos-latest'
        shell: bash
        env: { RIVET_DESKTOP_SMOKE: '1', RIVET_DATA_DIR: '${{ runner.temp }}/rivet data', RIVET_PORT: '0' }
        run: |
          export RIVET_RUN_FILE="$RIVET_DATA_DIR/running.json"
          app=$(ls -d desktop/release/mac*/Rivet.app | head -1)
          out=$(perl -e 'alarm 120; exec @ARGV' "$app/Contents/MacOS/Rivet" 2>&1 || true)
          echo "$out" | tail -5
          echo "$out" | grep -q "Rivet desktop app loaded from the local daemon"
          kill "$(node -p "require(process.env.RIVET_RUN_FILE).pid")" || true
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rivet-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/*.yml
            desktop/release/*.yml
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
